[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "nltk_rs"
description = "Rust-accelerated tokenizers and metrics for NLTK"
readme = "README.md"
authors = [{ name = "Amiya Mandal" }]
requires-python = ">=3.8"
license = { file = "LICENSE.txt" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
keywords = ["nltk", "tokenizer", "rust", "pyo3", "parallel"]
dependencies = [
    "click>=8.1.8",
    "gensim>=4.0.0 ; python_full_version < '3.14'",
    "markdown-it-py>=3.0.0",
    "matplotlib>=3.7.5",
    "maturin>=1.10.1",
    "mdit-plain>=1.0.1",
    "mdit-py-plugins>=0.4.2",
    "pylint>=3.2.7",
    "pytest>=6.0.1",
    "pytest-cov>=2.10.1",
    "pytest-mock>=3.14.1",
    "pytest-xdist[psutil]>=3.6.1",
    "pyyaml>=6.0.3",
    "regex>=2024.11.6",
    "scikit-learn>=1.3.2",
    "tox>=4.25.0",
    "tqdm>=4.67.1",
    "twython>=3.9.1",
]
[tool.maturin]
features = ["pyo3/extension-module"]
